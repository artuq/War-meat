name: War-Meat QA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: gdUnit4 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.6.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2.stable
          use-dotnet: false
          export-templates: false

      - name: Import projekt (generuje .uid files)
        run: godot --headless --path . --import --quit-after 60

      - name: Run gdUnit4 Tests
        uses: MikeSchulze/gdUnit4-action@v1.1.9
        with:
          godot-version: '4.6.2'
          godot-net: false
          paths: |
            res://tests/unit/
            res://tests/integration/
          report-directory: tests/reports
          timeout: 600
          retries: 0

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_number }}
          path: tests/reports/
          retention-days: 30

      - name: Python QA Analysis
        if: always()
        run: |
          pip install pillow --quiet
          python3 tests/run_qa.py --analyze-only --compare-baseline
        continue-on-error: true

      - name: Upload QA Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary-${{ github.run_number }}
          path: tests/reports/latest.json
          retention-days: 30

  regression-guard:
    name: Regression Check
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: qa-summary-${{ github.run_number }}
          path: tests/reports/

      - name: Check regression
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          report = Path("tests/reports/latest.json")
          if not report.exists():
              print("Brak raportu")
              sys.exit(0)
          data = json.loads(report.read_text())
          reg = data.get("regression", {})
          if reg.get("status") == "REGRESSION":
              new = reg.get("new_failures", [])
              print(f"REGRESJA: {len(new)} nowych failów!")
              for f in new:
                  print(f"  ❌ {f}")
              sys.exit(1)
          print("✅ Brak regresji")
          EOF
